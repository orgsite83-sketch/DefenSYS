[pytest]
# Note: DefenSYS relies primarily on Django's native test runner (`python manage.py test --keepdb`).
# The top-level `backend/tests/` directory contains ad-hoc maintenance, training, and manual smoke scripts.
# `--ignore=tests` prevents pytest from executing un-isolated helper scripts located in `backend/tests/`.
# Django app test suites are defined within app modules (e.g., `backend/modules/*/tests.py`).
DJANGO_SETTINGS_MODULE = defensys_backend.settings
python_files = tests.py test_*.py *_tests.py
addopts = --ignore=tests

