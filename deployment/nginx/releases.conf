# Include INSIDE the existing HTTPS server block, after its root directive.
# Keep Certbot's certificate and redirect configuration intact.
location = /releases/latest.json {
    alias /var/www/defensys-releases/metadata/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /releases/android/ {
    alias /var/www/defensys-releases/android/;
    autoindex off;
    types { application/vnd.android.package-archive apk; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /releases/web/ {
    alias /var/www/defensys-releases/web/;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /flutter_bootstrap.js {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# SPA routes internally redirect here. Never pin the startup document or the
# legacy unversioned bundle in a phone's HTTP cache.
location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    # Nginx location add_header directives replace server-level inheritance.
    # Preserve the application's document security policy here too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https://www.gstatic.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com;" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
}

location = /main.dart.js {
    gzip on;
    gzip_vary on;
    gzip_types application/javascript;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
