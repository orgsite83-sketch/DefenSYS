# Include INSIDE the existing HTTPS server block, after its root directive.
# Keep Certbot's certificate and redirect configuration intact.
location = /releases/latest.json {
    alias /var/www/defensys-releases/metadata/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
}

location /releases/android/ {
    alias /var/www/defensys-releases/android/;
    autoindex off;
    types { application/vnd.android.package-archive apk; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location /releases/web/ {
    alias /var/www/defensys-releases/web/;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /flutter_bootstrap.js {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
