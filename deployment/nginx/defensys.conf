server {
    listen 80;
    server_name defensys.yourdomain.edu;

    # Flutter web (static)
    root /var/www/defensys;
    index index.html;

    # Global client body size limit (matches Django's 500MB upload limit)
    client_max_body_size 500M;

    # Django API + admin
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin assets, etc.)
    location /static/ {
        alias /opt/defensys/backend/staticfiles/;
    }

    # WebSocket: live grading flags (Daphne on 8001)
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # SPA: send unknown paths to index.html (Flutter web routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
