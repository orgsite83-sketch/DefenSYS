<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DefenSYS capstone and PIT management system.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F8FAFC">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DefenSYS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>

  <title>DefenSYS</title>
  <script src="app_install.js"></script>
  <!-- PDF.js for Syncfusion PDF Viewer on Web (deferred to prevent blocking startup) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer onload="
    window['pdfjs-dist/build/pdf'] = window['pdfjsLib'];
    if (window['pdfjsLib']) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  "></script>

  </head>
  <body>
  <script>
    // Old Flutter workers cache the bare bootstrap URL. Use a fresh startup
    // URL so their fetch handler lets this request reach the server instead.
    // Keep this key different from "v", which legacy workers strip off.
    const bootstrap = document.createElement('script');
    const startupUrl = new URL('flutter_bootstrap.js', document.baseURI);
    startupUrl.searchParams.set('startup', Date.now().toString());
    bootstrap.src = startupUrl.href;
    bootstrap.async = true;
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
